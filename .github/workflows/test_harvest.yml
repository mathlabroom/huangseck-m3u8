name: HSCK_Test_Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 重要：全量拉取历史，否则中途 push 会冲突

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 执行收割脚本
        run: |
          # 运行过程中，脚本会每 1000 条自动执行 git push
          python main.py

      - name: Final Push changes
        if: always() # 无论脚本成功、超时还是失败，都执行最后的汇总推送
        run: |
          # 1. 增加 Git 缓冲区
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 2. 先拉取远程最新的更改（防止脚本中途推送后，本地落后于远程）
          git pull origin main --rebase

          # 3. 提交最后剩余的数据
          git add .
          git commit -m "Final Update: $(date +'%Y-%m-%d %H:%M') [Remaining Items]" || exit 0
          git push origin main
