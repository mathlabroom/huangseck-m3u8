name: HSCK_Test_Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 重要：全量拉取历史，否则中途 push 会冲突

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 执行收割脚本
        run: |
          # 运行过程中，脚本会每 1000 条自动执行 git push
          python main.py

      - name: Final Push changes
        if: always()
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 【核心修复】：先 add 和 commit，把最后剩下的几百条锁死
          # 这样工作区就干净了，pull --rebase 就不会报错
          git add .
          git commit -m "Final cleanup: save remaining items" || echo "No changes to commit"

          # 现在可以安全地拉取并合并了
          git pull origin main --rebase
          
          # 推送全量结果
          git push origin main
